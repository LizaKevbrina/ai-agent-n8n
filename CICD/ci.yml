name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # Job 1: Lint & Code Quality
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install linting tools
        run: |
          pip install flake8 black isort mypy
      
      - name: Run flake8
        run: |
          flake8 services/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 services/ --count --max-complexity=10 --max-line-length=127 --statistics
      
      - name: Check black formatting
        run: black --check services/
      
      - name: Check import sorting
        run: isort --check-only services/
  
  # Job 2: Unit Tests
  test:
    runs-on: ubuntu-latest
    needs: lint
    
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Install dependencies
        run: |
          pip install -r services/validation/requirements.txt
          pip install -r services/memory/requirements.txt
          pip install -r tests/requirements.txt
      
      - name: Run pytest
        env:
          POSTGRES_URL: postgresql://test_user:test_password@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379
        run: |
          pytest tests/ -v --cov=services --cov-report=xml --cov-report=term-missing
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
  
  # Job 3: Integration Tests
  integration:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Build Docker images
        run: |
          docker-compose build validation-service
          docker-compose build memory-service
      
      - name: Start services
        run: |
          docker-compose up -d redis postgres
          sleep 10
          docker-compose up -d validation-service memory-service
          sleep 15
      
      - name: Run integration tests
        run: |
          pip install pytest httpx pytest-asyncio
          pytest tests/test_integration.py -v
      
      - name: Stop services
        if: always()
        run: docker-compose down
  
  # Job 4: Security Scan
  security:
    runs-on: ubuntu-latest
    needs: lint
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
      
      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'
      
      - name: Run bandit security linter
        run: |
          pip install bandit
          bandit -r services/ -ll
  
  # Job 5: Build & Push Docker Images (only on main)
  build:
    runs-on: ubuntu-latest
    needs: [test, integration, security]
    if: github.ref == 'refs/heads/main'
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Build and push Validation Service
        uses: docker/build-push-action@v4
        with:
          context: ./services/validation
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/ai-validation:latest
            ${{ secrets.DOCKER_USERNAME }}/ai-validation:${{ github.sha }}
      
      - name: Build and push LLM Service
        uses: docker/build-push-action@v4
        with:
          context: ./services/llm
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/ai-llm:latest
            ${{ secrets.DOCKER_USERNAME }}/ai-llm:${{ github.sha }}
      
      # Аналогично для остальных сервисов...
  
  # Job 6: Deploy (только для production)
  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Deploy to production
        run: |
          echo "Deploying to production server..."
          # Здесь команды для деплоя (SSH, kubectl, etc.)
