name: PR Check

on:
  pull_request:
    branches: [ main, develop ]

jobs:
  pr-validation:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Check PR title
        run: |
          PR_TITLE="${{ github.event.pull_request.title }}"
          if [[ ! $PR_TITLE =~ ^(feat|fix|docs|refactor|test|chore): ]]; then
            echo "PR title must start with: feat|fix|docs|refactor|test|chore"
            exit 1
          fi
      
      - name: Check for secrets in code
        run: |
          if grep -r "YANDEX_API_KEY.*=" services/ | grep -v ".example"; then
            echo "Found hardcoded API key!"
            exit 1
          fi
      
      - name: Run quick tests
        run: |
          pip install pytest
          pytest tests/ -k "not integration" --tb=short
